<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f9f9f9;
        }

        header {
            background: #4CAF50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        main {
            margin: 20px auto;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        footer {
            text-align: center;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to My Simple Website</h1>
    </header>
    <main>
        <h2>About</h2>
        <p>This is a simple website created with HTML and CSS. You can use this as a starting point for your own
            projects.</p>
    </main>
    <footer>
        &copy; 2024 Simple Website
    </footer>
</body>

</html>
